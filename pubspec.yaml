name: questify
description: Questify - Turn your goals into quests.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Firebase (core must be first; all FlutterFire packages should be upgraded together)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  # Notifications on the device
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  # State management and navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  # Utilities
  intl: ^0.19.0
  fl_chart: ^0.69.0
  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
